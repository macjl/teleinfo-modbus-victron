[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "teleinfo-modbus-victron"
version = "0.3.0a1"
description = "Linky standard TIC to experimental ABB B21 and EM24 Modbus TCP interfaces"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pymodbus==3.16.1", "pyserial==3.5", "PyYAML==6.0.3"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
metrics = ["prometheus-client==0.25.0"]

[project.urls]
Repository = "https://github.com/macjl/teleinfo-modbus-victron"
Issues = "https://github.com/macjl/teleinfo-modbus-victron/issues"

[project.scripts]
teleinfo-modbus = "teleinfo_modbus_victron.app:main"

[tool.setuptools.packages.find]
include = ["teleinfo_modbus_victron*"]
